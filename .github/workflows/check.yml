name: Check

# 文書だけの変更でも整形とワークフローの検査は必要なため、変更内容によらず実行する。
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# 同じブランチへ続けて push したとき、結果を待つ必要のない古い実行を止める。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Formatting and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # タグは後から付け替えられるため、actions はコミット SHA で固定し、版はコメントに残す。
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      # jactionlint の版とチェックサムは mise.toml と mise.lock で固定する。
      - name: Install tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Check workflows
        run: jactionlint

      - name: Check Oxfmt formatting
        run: nix run ./nix#oxfmt -- --check .

      - name: Check Justfile formatting
        run: nix run ./nix#just -- --justfile justfile --fmt --check
