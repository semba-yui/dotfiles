name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# 同じブランチへ続けて push したとき、結果を待つ必要のない古い実行を止める。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    name: Nix configuration
    runs-on: macos-15
    # タグは後から付け替えられるため、actions はコミット SHA で固定し、版はコメントに残す。
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Check flake
        working-directory: nix
        run: nix flake check

      - name: Check Oxfmt formatting
        run: nix run ./nix#oxfmt -- --check .

      - name: Check Justfile formatting
        run: nix run ./nix#just -- --justfile justfile --fmt --check
