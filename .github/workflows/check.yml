name: Check

# 文書だけの変更でも整形とワークフローの検査は必要なため、変更内容によらず実行する。
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# 同じブランチへ続けて push したとき、結果を待つ必要のない古い実行を止める。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Formatting and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # タグは後から付け替えられるため、actions はコミット SHA で固定し、版はコメントに残す。
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2

      # jactionlint の版とチェックサムは mise.toml と mise.lock で固定する。
      - name: Install tools
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1

      - name: Check workflows
        run: jactionlint

      # flake の packages は Mac 向けにしか定義していないため、同じ flake.lock の nixpkgs から取り出し、
      # ローカルの dotfiles fmt と同じ版で検査する。
      - name: Check Oxfmt formatting
        run: nix run --inputs-from ./nix nixpkgs#oxfmt -- --check .

      - name: Check Justfile formatting
        run: nix run --inputs-from ./nix nixpkgs#just -- --justfile justfile --fmt --check
